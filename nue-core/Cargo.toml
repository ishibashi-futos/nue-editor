[package]
name = "nue-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
nue-config = { version = "0.1.0", path = "../nue-config" }
nue-mcp = { version = "0.1.0", path = "../nue-mcp" }
nue-semantic = { version = "0.1.0", path = "../nue-semantic" }
ropey = "1.6.1"
regex = "1"
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
